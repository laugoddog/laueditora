<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>42: your last habit tracker</title>
<meta name="description" content="Todos os anos prometes. Este ano, cumpre. A 42 é a app de hábitos que trabalha 42 dias de cada vez: regras claras, congelamentos, perdões e as rotinas dos Mestres. 7 dias grátis.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://laueditora.pt/42app/">
<meta property="og:type" content="website">
<meta property="og:title" content="42: your last habit tracker">
<meta property="og:description" content="Todos os anos prometes. Este ano, cumpre. 42 dias de cada vez.">
<meta property="og:url" content="https://laueditora.pt/42app/">
<meta property="og:image" content="https://laueditora.pt/42app/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#2A2724">
<link rel="icon" href="img/icone.png">
<link rel="apple-touch-icon" href="img/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600;1,700&family=Oswald:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://use.typekit.net/kww1ryt.css">
<style>
:root{
  --dk:#2A2724;--dk2:#33302C;--ln:#46423C;--cr:#F1ECE3;--cr2:#F4EEE3;--co:#D9736F;--co2:#C4605C;--mut:#A7A095;--ink:#1F1B16;--ice:#8FCBEA;
  --fh:'niagara-solid','Oswald','Arial Narrow',sans-serif;
  --fb:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --grain:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%200%200%20.6%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%20opacity%3D%27.22%27%2F%3E%3C%2Fsvg%3E");
  --wrap:min(1240px,calc(100vw - 64px));
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:var(--dk);color:var(--cr);font-family:var(--fb);font-size:21px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::after{content:"";position:fixed;inset:0;background:var(--grain);opacity:.55;pointer-events:none;z-index:90;mix-blend-mode:overlay}
img,svg,canvas{display:block}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{width:var(--wrap);margin:0 auto}
.k{font-family:var(--fh);text-transform:uppercase;letter-spacing:.24em;font-size:15px;font-weight:500;color:var(--mut)}
/* títulos: Niagara (Oswald se não carregar), em maiúsculas, como na app */
.h{font-family:var(--fh);font-weight:500;text-transform:uppercase;line-height:.9;letter-spacing:.005em}
.h em{font-style:normal;color:var(--co)}
.big{font-family:var(--fh);font-weight:500;line-height:.82}
/* palavras que sobem de uma máscara */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.04em;margin-bottom:-.04em}
.w>span{display:inline-block;transform:translateY(108%);transition:transform 1s cubic-bezier(.16,.84,.24,1)}
.on .w>span,.w.on>span{transform:none}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.16,.84,.24,1),transform 1s cubic-bezier(.16,.84,.24,1)}
.rv.on{opacity:1;transform:none}
.pin{position:relative}
.stick{position:sticky;top:0;height:100vh;height:100lvh;overflow:hidden}

/* ---------- cursor ---------- */
.cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--cr);pointer-events:none;z-index:95;mix-blend-mode:difference;transition:width .3s,height .3s,margin .3s,background .3s;display:none}
.cur.big{width:74px;height:74px;margin:-37px 0 0 -37px;background:var(--cr)}
@media (pointer:fine){ .cur{display:block} }

/* ---------- convite ---------- */
#inv{display:none;position:relative;z-index:70;background:var(--co);color:#FFF8F0}
#inv.on{display:block}
#inv .wrap{display:flex;align-items:center;gap:20px;justify-content:space-between;padding:16px 0;flex-wrap:wrap}
#inv b{font-family:var(--fh);font-weight:500;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
#inv .code{font-family:var(--fh);letter-spacing:.14em;font-size:18px;border:1px solid rgba(255,248,240,.7);padding:4px 12px;margin-left:12px;white-space:nowrap;display:inline-block;vertical-align:4px}
#inv .act{text-decoration:none;font-family:var(--fh);letter-spacing:.16em;text-transform:uppercase;font-size:15px;background:var(--dk);color:var(--cr);padding:13px 18px}
#inv .act[hidden]{display:none}
#inv small{display:block;font-size:17px;opacity:.92}
@media (max-width:620px){#inv .code{margin:8px 0 2px;display:table}}

/* ---------- cabeçalho ---------- */
header.top{position:fixed;top:0;left:0;right:0;z-index:80;transition:transform .5s cubic-bezier(.16,.84,.24,1)}
header.top.hide{transform:translateY(-110%)}
header.top.solid{background:var(--dk);border-bottom:1px solid var(--ln)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand img{height:38px;width:auto}
.nav{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid rgba(241,236,227,.35);background:rgba(42,39,36,.6)}
.lang button{font-family:var(--fh);font-size:13px;letter-spacing:.16em;padding:7px 10px;color:var(--mut)}
.lang button.on{background:var(--cr);color:var(--dk)}
.cta{font-family:var(--fh);text-transform:uppercase;letter-spacing:.18em;font-size:14px;background:var(--cr);color:var(--dk);padding:9px 16px;text-decoration:none;display:inline-block}
/* progresso: 42 traços no rodapé do ecrã */
.prog{position:fixed;left:0;right:0;bottom:0;height:4px;display:grid;grid-template-columns:repeat(42,1fr);gap:3px;z-index:80;padding:0 3px;pointer-events:none}
.prog i{background:rgba(241,236,227,.14);transition:background .3s}
.prog i.on{background:var(--cr)}
.prog i.on:last-child{background:var(--co)}

/* ---------- 1. herói: o percurso em 3D ---------- */
.hero{height:280vh}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(42,39,36,.9) 0%,rgba(42,39,36,.55) 38%,rgba(42,39,36,0) 62%);pointer-events:none}
.hero .txt{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;will-change:opacity,transform}
.hero .txt .in{width:var(--wrap);margin:0 auto;padding-top:84px}
.hero .txt .col{max-width:620px}
.hero h1{font-size:clamp(64px,min(7.2vw,11.5vh),132px);margin:18px 0 24px}
.hero h1 em{display:block;white-space:nowrap}
.hero .lead{font-size:clamp(21px,1.7vw,24px);color:#E2DBCF;max-width:28em}
.hero .lead i{color:var(--cr)}
.stores{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap;align-items:center}
.stores a{display:block;transition:transform .35s cubic-bezier(.16,.84,.24,1)}
.stores a:hover{transform:translateY(-3px)}
.stores img{height:56px;width:auto}
.fine{margin-top:18px;font-size:17px;color:var(--mut);font-style:italic}
.hud{position:absolute;right:max(32px,calc((100vw - 1240px)/2));bottom:44px;text-align:right;font-family:var(--fh);text-transform:uppercase;pointer-events:none}
.hud .l{letter-spacing:.24em;font-size:14px;color:var(--mut)}
.hud .n{font-size:clamp(70px,8vw,120px);line-height:.85;margin-top:6px}
.hud .n span{color:var(--mut);font-size:.42em;letter-spacing:.04em}
.cue{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--fh);letter-spacing:.3em;font-size:12px;color:var(--mut);pointer-events:none}
.cue i{width:1px;height:44px;background:linear-gradient(var(--cr),transparent);animation:drip 2.2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- 2. o padrão: um anel de 100 que se desfaz ---------- */
.pat{height:430vh;color:var(--ink)}
.pat .stick{background:var(--cr2)}
.pat .grid{width:var(--wrap);margin:0 auto;height:100%;display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;align-items:center;padding:88px 0 56px}
.pat .k{color:#7A7266}
.pat h2{font-size:clamp(56px,min(7vw,13vh),124px);margin-top:14px}
.tl{margin-top:56px;max-width:460px}
.tlbar{height:2px;background:#D3CABC;position:relative}
.tlbar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
.tlst{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px}
.tlst span{font-family:var(--fh);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:#A39B8E;transition:color .3s;position:relative;padding-top:6px}
.tlst span::before{content:"";position:absolute;left:0;top:-22px;width:2px;height:12px;background:#D3CABC;transition:background .3s}
.tlst span.on{color:var(--ink)}
.tlst span.on::before{background:var(--ink)}
.pring{position:relative;width:min(560px,100%,calc(100vh - 170px));aspect-ratio:1/1;justify-self:center}
.pring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#patRing rect{transition:transform .9s cubic-bezier(.16,.84,.24,1),opacity .9s,fill .4s;transform-box:fill-box;transform-origin:center}
#patRing rect.gone{opacity:0;transform:translateY(-90px) rotate(40deg) scale(.6)}
.pmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.pmid .pt{font-family:var(--fh);text-transform:uppercase;letter-spacing:.2em;font-size:15px;color:#7A7266}
.pmid .big{font-size:clamp(70px,min(9vw,15vh),170px);display:flex;align-items:flex-start;margin:6px 0 4px}
.pmid .big small{font-size:.36em;margin-top:.14em;margin-left:.03em}
.pmid .big .lt{font-size:.46em;margin-top:.5em;margin-right:.04em;color:var(--co2)}
.pmid .pc{font-size:clamp(15px,2.2vh,20px);font-style:italic;max-width:13em;line-height:1.3}
.pat .src{position:absolute;left:0;right:0;bottom:28px;width:var(--wrap);margin:0 auto;font-size:16px;color:#7A7266;font-style:italic}
.why{background:var(--cr2);color:var(--ink);padding:40px 0 170px}
.why .wrap{display:grid;grid-template-columns:1fr 1fr;gap:90px;align-items:start}
.why .long{margin-top:150px;align-items:center;grid-template-columns:1.1fr .9fr}
.long .lr{font-size:clamp(28px,2.6vw,40px);line-height:1.3}
.long .lr em{color:var(--co2)}
.long h3{font-size:clamp(56px,6vw,104px);margin-top:44px}
.lfig{justify-self:center;width:min(330px,80%)}
.phone2{background:#0E0D0C;border-radius:34px;padding:7px;box-shadow:inset 0 0 0 1px #3a3632,0 0 0 1.5px #57514A,0 40px 80px rgba(31,27,22,.28),0 10px 24px rgba(31,27,22,.18)}
.phone2 .sc{border-radius:27px;overflow:hidden;-webkit-mask-image:-webkit-radial-gradient(white,black)}
.phone2 img{width:100%;height:auto;display:block}
.lcap{margin-top:26px;font-size:21px;font-style:italic;line-height:1.4;color:#4A4741;text-align:center}
.two{height:240vh;color:var(--ink)}
.two .stick{background:var(--cr2)}
.two .grid{width:var(--wrap);margin:0 auto;height:100%;display:grid;grid-template-columns:minmax(0,480px) 1fr;gap:50px;align-items:center;padding:90px 0 40px}
.two .k{color:#7A7266}
.two h2{font-size:clamp(64px,7vw,124px);margin:18px 0 28px}
.two p{font-size:23px;max-width:21em}
.two .tw{position:absolute;top:64px;bottom:0;left:calc(max(32px,(100vw - 1240px)/2) + 520px);right:0}
.two .grid>div:first-child{position:relative;z-index:2}
.two .stick::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(max(32px,(100vw - 1240px)/2) + 560px);background:linear-gradient(90deg,var(--cr2) 80%,rgba(244,238,227,0));z-index:1;pointer-events:none}
@media (max-width:980px){ .two .stick::before{display:none} }
@media (max-width:980px){ .two .tw{position:relative;inset:auto;height:100%;min-height:0} .two .grid>div:first-child{background:none;padding:0} }
.two .tw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
.why .lead2{font-family:var(--fh);font-weight:500;text-transform:uppercase;font-size:clamp(48px,4.8vw,82px);line-height:.94}
.why .lead2 em{font-style:normal;color:var(--co2)}
.why p{font-size:23px}
blockquote{border-left:3px solid var(--co);padding:6px 0 6px 28px;margin-top:38px}
blockquote p{font-style:italic;font-size:27px!important;line-height:1.38}
blockquote cite{display:block;font-style:normal;margin-top:16px;font-family:var(--fh);letter-spacing:.16em;text-transform:uppercase;font-size:14px;color:#7A7266}

/* ---------- 3. método ---------- */
.met{padding:170px 0 150px;position:relative;overflow:hidden}
.met .wrap{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.met h2{font-size:clamp(72px,8.4vw,140px);margin:20px 0 34px}
.met .by{display:inline-block;font-family:var(--fh);text-transform:uppercase;letter-spacing:.18em;font-size:16px;color:var(--dk);background:var(--co);padding:9px 14px;margin:-12px 0 30px}
.met p{font-size:23px;color:#DCD5C9;max-width:27em}
.sci{margin-top:40px;padding-top:26px;border-top:1px solid var(--ln);font-size:19px!important;color:var(--mut)!important}
.sci i{color:var(--cr)}
.sim .rbox{position:relative;width:100%;max-width:540px;aspect-ratio:1/1;margin:0 auto}
.sim svg{width:100%;height:100%;overflow:visible}
.sim .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.sim .mid .k{font-size:15px}
.sim .mid .d{font-family:var(--fh);font-weight:500;font-size:clamp(120px,13vw,190px);line-height:.85;margin:6px 0 2px}
.sim .mid .s{font-style:italic;color:var(--mut);font-size:20px}
.legend{display:flex;gap:18px;justify-content:center;align-items:center;margin:10px 0 22px;flex-wrap:wrap;font-size:17px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:16px;display:block}
.legend .sv{gap:5px}
.legend svg{width:22px;height:22px}
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:540px;margin:0 auto;position:relative}
.ctrl button{font-family:var(--fh);text-transform:uppercase;letter-spacing:.14em;font-size:15px;padding:17px 8px;border:1px solid var(--ln);background:var(--dk2);display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s,transform .15s}
.ctrl button:hover{border-color:var(--mut)}
.ctrl button:active{transform:scale(.97)}
.ctrl button.do{background:var(--cr);color:var(--dk);border-color:var(--cr)}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl svg{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);max-width:540px;margin:18px auto 0;border-top:1px solid var(--ln)}
.stats div{padding:14px 0 0;text-align:center}
.stats b{display:block;font-family:var(--fh);font-weight:500;font-size:46px;line-height:1}
.stats span{font-family:var(--fh);text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--mut)}
.toast{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);background:var(--cr);color:var(--dk);font-family:var(--fh);letter-spacing:.14em;text-transform:uppercase;font-size:13px;padding:9px 14px;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1}

/* ---------- 4. regras: cartões que se empilham ---------- */
.rules{height:430vh}
.rules .stick{background:var(--co);color:#FFF8F0}
.rules .grid{width:var(--wrap);margin:0 auto;height:100%;display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;align-items:center;padding-top:64px}
.rules .k{color:#FCE2DC}
.rules h2{font-size:clamp(72px,8vw,136px);margin-top:18px}
.rules .count{margin-top:40px;font-family:var(--fh);font-size:22px;letter-spacing:.2em;color:#FCE2DC}
.rules .count b{color:#FFF8F0;font-weight:500}
.deck{position:relative;height:min(560px,66vh);perspective:1600px}
.card{position:absolute;inset:0;background:#2A2724;color:var(--cr);padding:clamp(24px,4.5vh,44px) 44px clamp(24px,4vh,40px);display:flex;flex-direction:column;gap:16px;box-shadow:0 40px 80px rgba(60,20,18,.35),0 8px 18px rgba(60,20,18,.25);will-change:transform;transform-origin:50% 0}
.card:nth-child(2){background:#F4EEE3;color:var(--ink)}
.card:nth-child(3){background:#2A2724}
.card:nth-child(4){background:#F4EEE3;color:var(--ink)}
.card .no{position:absolute;right:36px;top:34px;font-family:var(--fh);letter-spacing:.2em;font-size:15px;opacity:.55}
.card .bg{font-size:clamp(70px,13vh,190px);color:var(--co)}
.card .ic{display:flex;align-items:flex-start;color:var(--co);margin-top:.6vh}
.card .ic{margin-left:-14px;margin-top:-10px}
.card .ic svg{width:150px;height:150px}
.card h3{font-family:var(--fh);text-transform:uppercase;letter-spacing:.06em;font-size:clamp(28px,5vh,46px);font-weight:500;line-height:1;margin-top:auto}
.card p{font-size:clamp(17px,2.5vh,23px);max-width:24em}
.ladder{display:flex;flex-wrap:nowrap;white-space:nowrap;gap:0;font-size:19px;font-style:italic;width:max-content;max-width:none}
.ladder span{white-space:nowrap}
.ladder span:not(:last-child)::after{content:"·";margin:0 8px;opacity:.6;font-style:normal}

/* ---------- 5. Mestres: dois rios de retratos ---------- */
.vis{padding:170px 0 150px;overflow:hidden}
.vis .head{width:var(--wrap);margin:0 auto 80px;display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:end}
.vis h2{font-size:clamp(70px,8vw,136px);margin-top:18px}
.vis h2 .l1{white-space:nowrap;display:inline-block}
.vis .head>*{min-width:0}
.vis h2 .rot{white-space:nowrap;display:inline-block;color:var(--co);transition:opacity .22s,transform .22s}
.vis h2 .rot.out{opacity:0;transform:translateY(-.25em)}
.vis .head p{font-size:23px;color:#DCD5C9}
.river{display:flex;gap:22px;width:max-content;will-change:transform;padding:12px 0}
.river+.river{margin-top:22px}
.m{width:clamp(190px,17vw,250px);flex:0 0 auto}
.m .fr{aspect-ratio:3/3.9;border:1px solid var(--ln);background:#24211E;border-radius:16px;position:relative;overflow:hidden;--ink:var(--cr);--danger:var(--co);transition:border-color .3s,transform .5s cubic-bezier(.16,.84,.24,1)}
.m:hover .fr{border-color:var(--cr);transform:translateY(-8px) rotate(-1.2deg)}
.m .fr svg{position:absolute;left:4%;top:2%;width:92%;height:auto}
.m .fr .dd{position:absolute;left:14px;bottom:12px;font-family:var(--fh);letter-spacing:.2em;font-size:12px;color:var(--mut)}
.m .t{font-style:italic;font-size:18px;line-height:1.25;margin-top:12px}
.mnote{width:var(--wrap);margin:34px auto 0;color:var(--mut);font-style:italic;font-size:17px}

/* ---------- 6. percurso pela app: na horizontal ---------- */
.tour{color:var(--ink)}
.tour .stick{background:var(--cr2)}
.tour .hd{position:absolute;left:max(32px,calc((100vw - 1240px)/2));top:calc(50% + 32px);transform:translateY(-50%);width:min(360px,28vw);z-index:3}
.tour .mask{position:absolute;left:0;top:0;bottom:0;width:calc(max(32px,(100vw - 1240px)/2) + min(360px,28vw) + 80px);background:linear-gradient(90deg,var(--cr2) 78%,rgba(244,238,227,0));z-index:2;pointer-events:none}
.tour .k{color:#7A7266}
.tour h2{font-size:clamp(52px,min(6.4vw,12vh),118px);margin-top:16px}
.tour .sub{font-size:21px;color:#4A4741;margin-top:24px}
.track{position:absolute;left:0;top:calc(50% + 40px);display:flex;gap:64px;padding:0 max(32px,calc((100vw - 1240px)/2)) 0 calc(max(32px,(100vw - 1240px)/2) + min(360px,28vw) + 90px);will-change:transform;align-items:flex-start;z-index:1}
.track figure{flex:0 0 auto;width:clamp(220px,min(20vw,33vh),330px);will-change:transform}
.track .ph{background:#0E0D0C;border-radius:30px;padding:6px;box-shadow:inset 0 0 0 1px #3a3632,0 0 0 1.5px #57514A,0 40px 70px rgba(31,27,22,.28),0 10px 20px rgba(31,27,22,.18)}
.track .ph .sc{border-radius:24px;overflow:hidden;-webkit-mask-image:-webkit-radial-gradient(white,black)}
.track .ph img{width:100%;height:auto;display:block}
.track figcaption{margin-top:26px}
.track figure.wg{width:clamp(300px,min(27vw,40vh),440px)}
.wgs{display:flex;flex-direction:column;gap:14px}
.wgs img{width:100%;height:auto;border-radius:18px;box-shadow:0 30px 60px rgba(31,27,22,.28),0 8px 18px rgba(31,27,22,.18)}
.track figcaption b{display:block;white-space:nowrap;font-family:var(--fh);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:30px;line-height:1;margin-bottom:8px}
.track figcaption span{font-size:19px;line-height:1.35;display:block;color:#4A4741}
.track .endnote{width:clamp(260px,24vw,360px);align-self:center;font-size:24px;font-style:italic;color:#4A4741}
.tour .bar{position:absolute;left:0;right:0;bottom:36px;width:var(--wrap);margin:0 auto;height:2px;background:#D9D0C2}
.tour .bar i{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}

/* ---------- 7. criador ---------- */
.crt{padding:180px 0 170px}
.crt .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:90px;align-items:start}
.crt .side{position:sticky;top:130px}
.crt h2{font-size:clamp(70px,7.4vw,124px);margin-top:18px}
.letter p{font-size:25px;line-height:1.55;color:#E6E0D5}
.letter p+p{margin-top:1em}
.letter .lw{opacity:.14;transition:opacity .35s}
.letter .lw.on{opacity:1}
.letter p:first-child::first-letter{font-family:var(--fh);font-weight:500;float:left;font-size:4.2em;line-height:.8;padding:.06em .12em 0 0;color:var(--co)}
.letter .end{margin-top:36px!important;font-style:italic}
.letter .end+.end{margin-top:6px!important}
.sign canvas{width:300px;height:154px;color:var(--cr);margin-top:6px;margin-left:0}
.sign .nm{font-family:var(--fh);font-weight:500;text-transform:uppercase;font-size:34px;letter-spacing:.04em;margin-top:-6px}
.sign .nm span{font-size:.62em;color:var(--mut)}
.sign .cv{font-family:var(--fh);letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--mut);margin-top:10px;line-height:1.8}

/* ---------- 8. preço ---------- */
.price{background:var(--cr2);color:var(--ink);padding:170px 0 160px;position:relative}
.price .head{text-align:center;max-width:900px;margin:0 auto 80px}
.price .k{color:#7A7266}
.price h2{font-size:clamp(70px,8vw,136px);margin:18px 0 24px}
.price .head p{font-size:23px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;perspective:1400px}
.plan{border:1px solid #CFC6B8;padding:46px 38px 42px;display:flex;flex-direction:column;gap:4px;position:relative;background:#F8F3EA;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.16,.84,.24,1),box-shadow .5s;will-change:transform}
.plan:hover{box-shadow:0 40px 70px rgba(31,27,22,.18)}
.plan h3{font-family:var(--fh);text-transform:uppercase;letter-spacing:.2em;font-size:17px;font-weight:500;color:#7A7266}
.plan .v{font-family:var(--fh);font-weight:500;font-size:clamp(96px,8vw,132px);line-height:.9;margin-top:22px}
.plan .v small{font-size:.5em}
.plan .v .cm{font-family:inherit}
.plan p{font-size:20px;color:#4A4741;margin-top:10px}
.plan.hi{background:var(--dk);color:var(--cr);border-color:var(--dk)}
.plan.hi h3{color:var(--co)}
.plan.hi p{color:#CFC8BC}
.plan .tag{position:absolute;top:-1px;right:-1px;background:var(--co);color:#FFF8F0;font-family:var(--fh);letter-spacing:.18em;font-size:13px;padding:9px 13px;text-transform:uppercase}
.price .note{text-align:center;margin-top:36px;font-style:italic;font-size:20px;color:#4A4741}
.price .stores{justify-content:center}

/* ---------- 9. perguntas ---------- */
.faq{padding:170px 0 150px}
.faq .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:90px}
.faq h2{font-size:clamp(70px,7vw,118px);margin-top:18px}
details{border-top:1px solid var(--ln)}
details:last-child{border-bottom:1px solid var(--ln)}
summary{list-style:none;cursor:pointer;padding:28px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;font-family:var(--fh);font-weight:500;text-transform:uppercase;font-size:34px;line-height:1;letter-spacing:.02em;transition:color .2s}
summary:hover{color:var(--co)}
summary::-webkit-details-marker{display:none}
summary i{flex:0 0 auto;width:20px;height:20px;position:relative}
summary i::before,summary i::after{content:"";position:absolute;left:0;top:9px;width:20px;height:2px;background:currentColor;transition:transform .3s}
summary i::after{transform:rotate(90deg)}
details[open] summary i::after{transform:rotate(0)}
details p{padding:0 0 30px;font-size:22px;color:#DCD5C9;max-width:34em}

/* ---------- 10. fim: o anel fecha-se ---------- */
.fin{height:230vh}
.fin .stick{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fin .stage{position:relative;width:min(460px,44vh,82vw);aspect-ratio:1/1;margin-top:64px}
.fin svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fin .lg{position:absolute;left:50%;top:50%;width:32%;transform:translate(-46%,-52%) scale(var(--s,1));will-change:transform}
.fin .tx{margin-top:10px}
.fin h2{font-size:clamp(48px,min(7vw,11vh),130px);margin:14px 0 8px}
.fin p{font-size:23px;color:#DCD5C9;font-style:italic}
.fin .stores{justify-content:center;margin-top:30px}
footer{border-top:1px solid var(--ln);padding:44px 0 64px;color:var(--mut);font-size:17px;position:relative;background:var(--dk)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
footer .by{display:flex;align-items:center;gap:16px}
footer .by img{height:40px}
footer a{text-decoration:none;border-bottom:1px solid var(--ln)}
footer a:hover{color:var(--cr)}
footer nav{display:flex;gap:22px;flex-wrap:wrap}

/* cortina coral/creme: um círculo que se abre ao entrar */
.wipe{clip-path:inset(0 7% 0 7% round 64px 64px 0 0)}

/* ---------- retratos (CSS da app) ---------- */
.va .ptw{fill:var(--ink);fill-rule:evenodd}

.va .ptbob{animation:ptbob 2.4s ease-in-out infinite}
.va .ptbreathe{animation:ptbreathe 5s ease-in-out infinite}
.va .ptglow{animation:ptglow 4s ease-in-out infinite}
.va .ptwig{animation:ptwig 4.2s ease-in-out infinite}
.va .ptwig2{animation:ptwig2 4.4s ease-in-out infinite}
.va .ptskew{animation:ptskew 6s ease-in-out infinite}
.va .ptskew2{animation:ptskew 5.4s ease-in-out infinite}

.va .ptblink{animation:ptblink 3.2s ease-in-out infinite}

.va .pthalo{animation:pthalo 5s ease-in-out infinite}
.va .ptpipe{animation:ptpipe 5s ease-in-out infinite}
.va .ptneck{animation:ptneck 5.6s ease-in-out infinite}.va .ptlens{fill:var(--danger);opacity:.38}.pthair{animation:pthair 6s ease-in-out infinite}.pthair2{animation:pthair 6.8s ease-in-out -2.4s infinite}.ptbeard{animation:ptbeard 6.4s ease-in-out infinite}.ptlook{animation:ptlook 6s ease-in-out infinite}.ptbrow{animation:ptbrow 5.2s ease-in-out infinite}.ptbreath{animation:ptbob 5.6s ease-in-out infinite}.ptbun{animation:ptbun 5.6s ease-in-out infinite}@keyframes pthair{0%,100%{transform:skewX(-2.8deg)}50%{transform:skewX(2.8deg)}}@keyframes ptbeard{0%,100%{transform:skewX(-3deg)}50%{transform:skewX(3deg)}}@keyframes ptlook{0%,100%{transform:translateX(-2.5px)}50%{transform:translateX(2.5px)}}@keyframes ptbrow{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}@keyframes ptbun{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes ptglm{0%{transform:translateX(0)}100%{transform:translateX(var(--gd,90px))}}
@keyframes ptjab{0%,100%{transform:translate(0,0) scale(1)}30%{transform:translate(-9px,3.5px) scale(1.1)}50%{transform:translate(-2px,.8px) scale(1.02)}75%{transform:translate(-7px,2.8px) scale(1.07)}}
@keyframes ptlip{0%,100%{transform:scale(1,1)}50%{transform:scale(1.1,.84)}}
@keyframes ptsway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}

@keyframes ptpipe{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}

<body>
<div class="cur" id="cur"></div>
<div class="prog" id="prog" aria-hidden="true"></div>

<div id="inv" role="region" aria-live="polite">
  <div class="wrap">
    <div><b data-t="inv_t"></b><span class="code" id="invCode"></span><small id="invMsg"></small></div>
    <a class="act" id="invIos" href="#" hidden data-t="inv_ios"></a>
  </div>
</div>

<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="#" aria-label="42"><img src="img/logo-42.svg" alt="42"></a>
    <div class="nav">
      <div class="lang" role="group" aria-label="Língua / Language"><button data-l="pt">PT</button><button data-l="en">EN</button></div>
      <a class="cta" href="#descarregar" id="topCta" data-t="get"></a>
    </div>
  </div>
</header>

<main>
<!-- 1. herói: o percurso da app, em 3D, a avançar com o scroll -->
<section class="pin hero" id="hero">
  <div class="stick">
    <canvas id="world" aria-hidden="true"></canvas>
    <div class="shade"></div>
    <div class="txt" id="heroTxt"><div class="in"><div class="col">
      <div class="k">42 · the last habit tracker you will ever install</div>
      <h1 class="h sp" data-h="h1"></h1>
      <p class="lead" data-h="lead"></p>
      <div class="stores" data-stores></div>
      <p class="fine" data-t="fine"></p>
    </div></div></div>
    <div class="hud" aria-hidden="true"><div class="l" id="hudL"></div><div class="n" id="hudN">1<span>/42</span></div></div>
    <div class="cue" id="cue" aria-hidden="true"><i></i></div>
  </div>
</section>

<!-- 2. o padrão -->
<section class="pin pat wipe" id="pat">
  <div class="stick">
    <div class="grid">
      <div>
        <div class="k" data-t="pat_k"></div>
        <h2 class="h sp" data-h="pat_h"></h2>
        <div class="tl"><div class="tlbar"><i id="tlFill"></i></div><div class="tlst" id="tlst"></div></div>
      </div>
      <div class="pring">
        <svg id="patRing" viewBox="-300 -300 600 600" aria-hidden="true"></svg>
        <div class="pmid"><div class="pt" id="patT"></div><div class="big"><span class="lt" id="patLt" hidden>&lt;</span><span id="patV">77</span><small>%</small></div><div class="pc" data-t="pat_c"></div></div>
      </div>
    </div>
    <p class="src" data-t="pat_src"></p>
  </div>
</section>
<section class="why">
  <div class="wrap">
    <div class="lead2 sp" data-h="why_big"></div>
    <div class="rv">
      <p data-h="why_p"></p>
      <blockquote><p data-h="quote"></p><cite data-t="quote_c"></cite></blockquote>
    </div>
  </div>
  <div class="wrap long">
    <div class="lt">
      <p class="lr rv" data-h="long_p"></p>
      <h3 class="h sp" data-h="long_2"></h3>
    </div>
    <div class="lfig rv"><div class="phone2"><div class="sc"><img src="img/app-percurso.webp" alt="" width="603" height="1259" loading="lazy"></div></div><p class="lcap" data-t="long_cap"></p></div>
  </div>
</section>

<!-- 3. método -->
<section class="met">
  <div class="wrap">
    <div>
      <div class="k" data-t="met_k"></div>
      <h2 class="h sp" data-h="met_h"></h2>
      <div class="by rv" data-t="met_by"></div>
      <p class="rv" data-h="met_p"></p>
      <p class="rv sci" data-h="met_sci"></p>
    </div>

        <svg id="simRing" viewBox="-300 -300 600 600" aria-hidden="true"></svg>

      </div>

        <button id="bFz"><svg viewBox="0 0 24 24" fill="none" stroke="#8FCBEA" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5"/></svg><span data-t="sim_fz"></span></button>
        <button id="bMiss"><svg viewBox="0 0 24 24" fill="none" stroke="#D9736F" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-t="sim_miss"></span></button>
      </div>
      <div class="stats"><div><b id="sStreak">0</b><span data-t="sim_st"></span></div><div><b id="sLaps">0</b><span data-t="sim_laps"></span></div><div><b id="sFz">2</b><span data-t="sim_fzs"></span></div></div>
    </div>
  </div>
</section>

<!-- 3b. duas visões numa só: o percurso visto de cima -->
<section class="pin two wipe" id="two">
  <div class="stick">
    <div class="grid">
      <div><div class="k" data-t="two_k"></div><h2 class="h sp" data-h="two_h"></h2><p class="rv" data-h="two_p"></p></div>
      <div class="tw"><img id="pathImg" src="img/path/00.webp" alt="" aria-hidden="true"></div>
    </div>
  </div>
</section>

<!-- 4. regras -->
<section class="pin rules wipe" id="rules">
  <div class="stick">
    <div class="grid">
      <div>
        <div class="k" data-t="rul_k"></div>
        <h2 class="h sp" data-h="rul_h"></h2>
        <div class="count"><b id="rcN">01</b> / 04</div>

  TOUR.style.height=(tourOff+vh+trackSpan*1.15)+'px';
  sizeCv();
}
function fitLine(h,els,W){ h.style.fontSize=''; var fs=parseFloat(getComputedStyle(h).fontSize),wide=function(){ return els.some(function(e){ return Math.max(e.getBoundingClientRect().width,e.scrollWidth)>W+1; }); };
  for(var i=0;i<60&&wide()&&fs>24;i++){ fs-=2; h.style.fontSize=fs+'px'; } }
function fitVis(){ var h=document.getElementById('visH'),l=h.querySelector('.l1'),rot=document.getElementById('rot'),t=T[LANG],keep=rot.textContent,
    longest=t.rot.reduce(function(a,b){ return b.length>a.length?b:a; },'');
  rot.textContent=longest; fitLine(h,[l,rot],h.parentNode.clientWidth); rot.textContent=keep;
  var h1=document.querySelector('.hero h1'),em=h1.querySelector('em'); if(em) fitLine(h1,[em],h1.parentNode.clientWidth);
  var ld=document.getElementById('ladder'),cd=ld.closest('.card'); ld.style.fontSize=''; if(innerWidth<=980) return; var fs=19,cw=cd.clientWidth-parseFloat(getComputedStyle(cd).paddingLeft)*2; while(ld.scrollWidth>cw&&fs>9){ fs-=.5; ld.style.fontSize=fs+'px'; } }
function drawTour(p){
  var x=-trackSpan*ease(p); TRACK.style.transform='translate3d('+x+'px,0,0)';
  var mid=innerWidth/2;
  TRACK.querySelectorAll('figure').forEach(function(fg){ var r=fg.getBoundingClientRect(),d=clamp(((r.left+r.width/2)-mid)/mid,-1.4,1.4);
    var ph=fg.querySelector('.ph,.wgs'); if(ph) ph.style.transform='perspective(1200px) rotateY('+(-d*(innerWidth<=620?5:12))+'deg)'; fg.style.transform=''; });
  document.getElementById('tourBar').style.transform='scaleX('+p+')';
}

/* ---------- 7. carta: as palavras acendem-se ao ler ---------- */
var LETTER=document.getElementById('letter');
function drawLetter(){
  var ws=LETTER.querySelectorAll('.lw'),line=innerHeight*.72;
  for(var i=0;i<ws.length;i++){ var r=ws[i].getBoundingClientRect(); ws[i].classList.toggle('on',r.top<line); }
}

/* ---------- assinatura (o mesmo aparo e a mesma pressão da app) ---------- */
function nibW(st,P){
  var al=-P.a*Math.PI/180,o=[],ew=null,i;
  if(st.length<6) return st.map(function(){ return P.w*1.15; });
  for(i=0;i<st.length;i++){
    var a=st[Math.max(0,i-2)],b=st[Math.min(st.length-1,i+2)],dx=b[0]-a[0],dy=b[1]-a[1],th=Math.atan2(dy,dx);
    var dirf=(dx||dy)?(1-P.c)+P.c*Math.abs(Math.sin(th-al)):1-P.c*.5,prf=.28+.72*Math.pow(Math.max(.05,st[i][3]),.8),w=P.w*prf*dirf;
    ew=ew==null?w:ew+(w-ew)*.45; o.push(ew); }
  if(o.length){ var n=Math.min(4,o.length); for(var j=0;j<n;j++){ o[j]*=.55+.45*j/n; o[o.length-1-j]*=.6+.4*j/n; } }
  return o; }
function sign(canvas,instant){
  if(!window.SIGP) return;
  var dpr=Math.min(3,window.devicePixelRatio||1),r=canvas.getBoundingClientRect(); canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
  var g=canvas.getContext('2d'),k=Math.min(canvas.width/(824-163),canvas.height/(497-154)),W=SIGP.s.map(function(st){ return nibW(st,SIGP.nib); });
  g.setTransform(1,0,0,1,-163*k,-154*k);
  g.fillStyle=getComputedStyle(canvas).color;
  function seg(si,i){ var st=SIGP.s[si],w=W[si],x=st[i][0]*k,y=st[i][1]*k,rr=w[i]*k/2;
    g.beginPath(); g.arc(x,y,rr,0,7); g.fill();
    if(i){ var x0=st[i-1][0]*k,y0=st[i-1][1]*k,r0=w[i-1]*k/2,dx=x-x0,dy=y-y0,L=Math.hypot(dx,dy); if(L>0){ var nx=-dy/L,ny=dx/L;
      g.beginPath(); g.moveTo(x0+nx*r0,y0+ny*r0); g.lineTo(x+nx*rr,y+ny*rr); g.lineTo(x-nx*rr,y-ny*rr); g.lineTo(x0-nx*r0,y0-ny*r0); g.closePath(); g.fill(); } } }
  if(instant||reduce){ SIGP.s.forEach(function(st,si){ for(var i=0;i<st.length;i++) seg(si,i); }); return; }
  var pos=SIGP.s.map(function(){ return 0; }),t0=performance.now(),last=SIGP.s[SIGP.s.length-1],T0=last[last.length-1][2];
  (function fr(now){ var tt=(now-t0)/.9; SIGP.s.forEach(function(st,si){ while(pos[si]<st.length&&st[pos[si]][2]<=tt){ seg(si,pos[si]); pos[si]++; } }); if(tt<=T0) requestAnimationFrame(fr); })(t0);
}

/* ---------- 8. preço: cartões que inclinam com o rato ---------- */
document.querySelectorAll('.plan').forEach(function(pl){
  pl.addEventListener('pointermove',function(e){ if(e.pointerType!=='mouse') return; var r=pl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    pl.style.transform='rotateY('+(x*10)+'deg) rotateX('+(-y*10)+'deg) translateZ(10px)'; });
  pl.addEventListener('pointerleave',function(){ pl.style.transform=''; });
});

/* ---------- 10. fim: o anel fecha-se com o scroll ---------- */
var FR=ring(document.getElementById('finRing'),252,22,46),finLit=-1;
function drawFin(p){
  var n=Math.round(clamp(p*1.4,0,1)*42);
  if(n!==finLit){ finLit=n; FR.b.forEach(function(b,i){ if(i<n) fill(b,i===41?'#D9736F':'#F1ECE3'); else empty(b); }); }
  document.getElementById('finLg').style.setProperty('--s',(.55+.45*ease(clamp(p*1.4,0,1))).toFixed(3));
  var tx=document.getElementById('finTx'),q=clamp((p-.62)/.25,0,1); tx.style.opacity=q; tx.style.transform='translateY('+((1-q)*40)+'px)';
}

/* ---------- motor: um só ciclo para tudo o que mexe com o scroll ---------- */
function prog(el){ var r=el.getBoundingClientRect(),span=r.height-innerHeight; return span>0?clamp(-r.top/span,0,1):(r.top<0?1:0); }
function vis(el){ var r=el.getBoundingClientRect(); return r.bottom>-200&&r.top<innerHeight+200; }
var SHADE=document.querySelector('.hero .shade'),HUD=document.querySelector('.hud'),HERO=document.getElementById('hero'),PAT=document.getElementById('pat'),RUL=document.getElementById('rules'),FIN=document.getElementById('fin'),HT=document.getElementById('heroTxt');
var WIPES=document.querySelectorAll('.wipe'),PROG=document.getElementById('prog'),progI;
PROG.innerHTML=new Array(43).join('<i></i>'); progI=PROG.querySelectorAll('i');
var lastY=scrollY,vel=0,lastProgN=-1,topEl=document.getElementById('top'),invEl=document.getElementById('inv');
function tick(force){
  var y=scrollY; vel=vel*.85+(y-lastY)*.15; lastY=y;
  if(force||vis(HERO)){ heroP=prog(HERO); var q=clamp(heroP/.42,0,1);
    if(innerWidth<=620){ var H=HERO.querySelector('.stick').offsetHeight,d=(heroHz(reduce?0:heroP)-.94)*H,hzpx=heroHz(reduce?0:heroP)*H,fade=clamp((heroP-.32)/.16,0,1);
      HT.style.opacity=1-fade; HT.style.transform='translateY('+(d*1.6)+'px)';
      SHADE.style.background='linear-gradient(180deg,#2A2724 0,#2A2724 '+Math.max(0,hzpx+d*.6-170)+'px,rgba(42,39,36,0) '+Math.max(0,hzpx+d*.6-20)+'px)'; SHADE.style.opacity=1-fade;
      HUD.style.opacity=clamp((heroP-.42)/.12,0,1); }
    else { HT.style.opacity=1-ease(q); HT.style.transform='translateY('+(-q*80)+'px)'; SHADE.style.background=''; SHADE.style.opacity=1; HUD.style.opacity=1; } document.getElementById('cue').style.opacity=1-clamp(heroP*6,0,1); }
  if(force||vis(PAT)) drawPat(prog(PAT));
  if(force||vis(RUL)) drawRules(prog(RUL));
  if(force||vis(TOUR)) drawTour(progTour());
  if(force||vis(TWO)) drawPathSeq(prog(TWO));
  if(force||vis(LETTER)) drawLetter();
  if(force||vis(FIN)) drawFin(prog(FIN));
  WIPES.forEach(function(w){ var r=w.getBoundingClientRect(),q=reduce?1:clamp((innerHeight-r.top)/(innerHeight*.9),0,1); var e=ease(q); w.style.clipPath=q>=1?'none':'inset(0 '+((1-e)*7).toFixed(2)+'% 0 '+((1-e)*7).toFixed(2)+'% round '+((1-e)*64).toFixed(1)+'px '+((1-e)*64).toFixed(1)+'px 0 0)'; });
  var total=document.documentElement.scrollHeight-innerHeight,n=Math.round(clamp(y/total,0,1)*42);
  if(n!==lastProgN){ lastProgN=n; progI.forEach(function(el,i){ el.classList.toggle('on',i<n); }); }
  topEl.classList.toggle('solid',y>40);
  var bh=invEl.classList.contains('on')?invEl.offsetHeight:0; topEl.style.top=Math.max(0,bh-y)+'px';
}
var rvT=performance.now();
function frame(now){
  tick(false);
  if(vis(HERO)) drawWorld(now);
  var dt=Math.min(.05,(now-rvT)/1000); rvT=now;
  if(!reduce&&vis(RV1)){ var sp=40+Math.abs(vel)*6; rvX[0]=(rvX[0]-sp*dt)%rvW[0]; rvX[1]=(rvX[1]+sp*dt)%rvW[1]; if(rvX[1]>0) rvX[1]-=rvW[1];
    RV1.style.transform='translate3d('+rvX[0]+'px,0,0)'; RV2.style.transform='translate3d('+(rvX[1])+'px,0,0)'; }
  requestAnimationFrame(frame);
}

/* ---------- entradas ---------- */
var seen=new Set();
var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(!e.isIntersecting) return; var el=e.target; el.classList.add('on'); seen.add(el);
  if(el.id==='sim') simBuild();
  if(el.id==='sign') sign(document.getElementById('sigCv'));
  io.unobserve(el); }); },{threshold:.15,rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.rv,.sp,#sign').forEach(function(el){ io.observe(el); });
new IntersectionObserver(function(es){ if(es[0].isIntersecting) loadMasters(); },{rootMargin:'1200px'}).observe(document.getElementById('vis'));
/* o herói está sempre à vista ao abrir */
setTimeout(function(){ document.querySelectorAll('#hero .sp').forEach(function(el){ el.classList.add('on'); seen.add(el); }); },150);

/* ---------- cursor ---------- */
(function(){ var c=document.getElementById('cur'); if(!matchMedia('(pointer:fine)').matches) return; var x=-100,y=-100,X=-100,Y=-100;
  addEventListener('pointermove',function(e){ x=e.clientX; y=e.clientY; var t=e.target; c.classList.toggle('big',!!(t.closest&&t.closest('a,button,summary,.m'))); },{passive:true});
  (function lp(){ X+=(x-X)*.22; Y+=(y-Y)*.22; c.style.transform='translate3d('+X+'px,'+Y+'px,0)'; requestAnimationFrame(lp); })(); })();

var lastW=innerWidth; addEventListener('resize',function(){ if(innerWidth===lastW) return; lastW=innerWidth; measure(); tick(true); });
apply(); measure(); tick(true); requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ measure(); tick(true); });
})();
</script>

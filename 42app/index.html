<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>42: your last habit tracker</title>
<meta name="description" content="Todos os anos prometes. Este ano, cumpre. A 42 é a app de hábitos que trabalha 42 dias de cada vez: regras claras, congelamentos, perdões e as rotinas dos Mestres. 7 dias grátis.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://laueditora.pt/42app/">
<meta property="og:type" content="website">
<meta property="og:title" content="42: your last habit tracker">
<meta property="og:description" content="Todos os anos prometes. Este ano, cumpre. 42 dias de cada vez.">
<meta property="og:url" content="https://laueditora.pt/42app/">
<meta property="og:image" content="https://laueditora.pt/42app/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#2A2724">
<link rel="icon" href="img/icone.png">
<link rel="apple-touch-icon" href="img/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600;1,700&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="https://use.typekit.net/kww1ryt.css">
<style>
:root{
  --dk:#2A2724;--dk2:#33302C;--dk3:#3B3732;--ln:#46423C;--cr:#F1ECE3;--cr2:#F4EEE3;--co:#D9736F;--co2:#C4605C;--mut:#A7A095;--ink:#1F1B16;--ice:#8FCBEA;
  --fd:'Bodoni Moda','Bodoni 72',Didot,Georgia,serif;
  --fh:'niagara-solid','Oswald','Arial Narrow',sans-serif;
  --fb:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --grain:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%200%200%20.6%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%20opacity%3D%27.22%27%2F%3E%3C%2Fsvg%3E");
  --wrap:min(1180px,calc(100vw - 48px));
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--dk);color:var(--cr);font-family:var(--fb);font-size:20px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;background:var(--grain);opacity:.55;pointer-events:none;z-index:50;mix-blend-mode:overlay}
img,svg,canvas{display:block}
a{color:inherit}
em{font-style:italic}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{width:var(--wrap);margin:0 auto}
.k{font-family:var(--fh);text-transform:uppercase;letter-spacing:.22em;font-size:15px;font-weight:500;color:var(--mut)}
.h{font-family:var(--fd);font-weight:400;line-height:1.02;letter-spacing:-.01em}
.h em{font-family:var(--fb);font-weight:500;font-style:italic;letter-spacing:0}
.sec{position:relative;padding:150px 0}
.cream{background:var(--cr2);color:var(--ink)}
.cream .k{color:#7A7266}
.coral{background:var(--co);color:#FFF8F0}
.coral .k{color:#FCE2DC}
/* aparecer ao descer: corte seco e subida curta */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}.rv.d4{transition-delay:.48s}

/* ---------- convite ---------- */
#inv{display:none;position:relative;z-index:60;background:var(--co);color:#FFF8F0}
#inv.on{display:block}
#inv .wrap{display:flex;align-items:center;gap:20px;justify-content:space-between;padding:16px 0;flex-wrap:wrap}
#inv b{font-family:var(--fd);font-weight:500;font-size:22px}
#inv .code{font-family:var(--fh);letter-spacing:.14em;font-size:17px;border:1px solid rgba(255,248,240,.6);padding:5px 12px;margin-left:12px;white-space:nowrap;display:inline-block;vertical-align:3px}
@media (max-width:620px){#inv .code{margin:8px 0 2px;display:table}}
#inv .act{text-decoration:none;font-family:var(--fh);letter-spacing:.16em;text-transform:uppercase;font-size:15px;background:var(--dk);color:var(--cr);padding:13px 18px}
#inv .act[hidden]{display:none}
#inv small{display:block;font-size:17px;opacity:.9}

/* ---------- cabeçalho ---------- */
header.top{position:fixed;top:0;left:0;right:0;z-index:40;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.top.solid{background:rgba(42,39,36,.92);backdrop-filter:none;border-bottom-color:var(--ln)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:78px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand img{height:46px;width:auto}
.brand span{font-family:var(--fh);letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--mut)}
.nav{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--ln)}
.lang button{font-family:var(--fh);font-size:13px;letter-spacing:.16em;padding:9px 11px;color:var(--mut)}
.lang button.on{background:var(--cr);color:var(--dk)}
.cta{font-family:var(--fh);text-transform:uppercase;letter-spacing:.18em;font-size:14px;background:var(--cr);color:var(--dk);padding:12px 18px;text-decoration:none;display:inline-block;transition:background .2s}
.cta:hover{background:#fff}

/* ---------- herói ---------- */
.hero{min-height:100vh;display:flex;align-items:center;padding:120px 0 80px;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(50px,5.6vw,90px);margin:24px 0 30px}
.hero h1 em{color:var(--co);display:block}
.hero .lead{font-size:clamp(21px,1.9vw,25px);max-width:30em;color:#DCD5C9}
.hero .lead i{color:var(--cr)}
.stores{display:flex;gap:14px;margin-top:42px;flex-wrap:wrap;align-items:center}
.stores a{display:block;transition:transform .2s}
.stores a:hover{transform:translateY(-2px)}
.stores img{height:54px;width:auto}
.fine{margin-top:18px;font-size:17px;color:var(--mut);font-style:italic}
.stage{position:relative;aspect-ratio:1/1;width:100%;max-width:640px;justify-self:center}
.stage svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.phone{position:absolute;left:50%;top:50%;width:44%;transform:translate(-50%,-50%);border-radius:34px;padding:9px;background:#141210;box-shadow:0 0 0 1px #4a453f,0 40px 80px rgba(0,0,0,.55),0 10px 24px rgba(0,0,0,.4)}
.phone img{width:100%;height:auto;border-radius:26px}
.scrollhint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-family:var(--fh);letter-spacing:.3em;font-size:12px;color:var(--mut);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:10px}
.scrollhint i{display:block;width:1px;height:38px;background:linear-gradient(var(--mut),transparent);animation:drip 2.2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- o padrão ---------- */
.pat h2{font-size:clamp(46px,6vw,92px);margin:20px 0 70px;max-width:12em}
.decay{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid #CFC6B8}
.decay>div{padding:30px 26px 0 0;border-right:1px solid #CFC6B8;margin-right:26px}
.decay>div:last-child{border-right:0;margin-right:0}
.decay .n{font-family:var(--fd);font-size:clamp(54px,6.2vw,96px);line-height:1}
.decay .n small{font-size:.5em}
.decay p{font-size:20px;margin-top:10px;max-width:11em}
.decay .bar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:22px;max-width:220px}
.decay .bar i{aspect-ratio:1/1.5;border:1px solid #2A2724;transition:background .5s}
.decay .bar i.on{background:#2A2724}
.decay>div:last-child .bar i.on:last-child{background:var(--co);border-color:var(--co)}
.src{font-size:16px;color:#7A7266;margin-top:34px;font-style:italic}
.why{display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:120px;align-items:start}
.why .big{font-family:var(--fd);font-size:clamp(30px,3vw,44px);line-height:1.15}
.why .big em{color:var(--co2)}
.why p{font-size:22px}
blockquote{border-left:3px solid var(--co);padding:6px 0 6px 28px;margin-top:34px}
blockquote p{font-style:italic;font-size:24px!important;line-height:1.4}
blockquote cite{display:block;font-style:normal;margin-top:14px;font-family:var(--fh);letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:#7A7266}

/* ---------- método ---------- */
.met .wrap{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.met h2{font-size:clamp(46px,5.4vw,84px);margin:20px 0 30px}
.met h2 em{color:var(--co)}
.met p{font-size:22px;color:#DCD5C9;max-width:27em}
.sim{position:relative}
.sim .rbox{position:relative;width:100%;max-width:520px;aspect-ratio:1/1;margin:0 auto}
.sim svg{width:100%;height:100%;overflow:visible}
.sim .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.sim .mid .k{font-size:14px}
.sim .mid .d{font-family:var(--fd);font-size:clamp(74px,9vw,128px);line-height:1}
.sim .mid .s{font-style:italic;color:var(--mut);font-size:19px}
.legend{display:flex;gap:18px;justify-content:center;align-items:center;margin:8px 0 22px;flex-wrap:wrap;font-size:17px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:16px;display:block}
.legend .sv{gap:5px}
.legend svg{width:22px;height:22px}
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:0 auto}
.ctrl button{font-family:var(--fh);text-transform:uppercase;letter-spacing:.14em;font-size:14px;padding:16px 8px;border:1px solid var(--ln);background:var(--dk2);transition:background .15s,border-color .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.ctrl button:hover{border-color:var(--mut)}
.ctrl button.do{background:var(--cr);color:var(--dk);border-color:var(--cr)}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl svg{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);max-width:520px;margin:18px auto 0;border-top:1px solid var(--ln)}
.stats div{padding:14px 0 0;text-align:center}
.stats b{display:block;font-family:var(--fd);font-weight:400;font-size:34px}
.stats span{font-family:var(--fh);text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--mut)}
.sci{margin-top:40px;padding-top:26px;border-top:1px solid var(--ln);font-size:19px!important;color:var(--mut)!important}
.sci i{color:var(--cr)}
.toast{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:var(--cr);color:var(--dk);font-family:var(--fh);letter-spacing:.14em;text-transform:uppercase;font-size:13px;padding:9px 14px;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1}

/* ---------- regras ---------- */
.rules h2{font-size:clamp(46px,5.6vw,88px);margin:20px 0 70px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid rgba(255,248,240,.45)}
.card{padding:34px 28px 38px;border-right:1px solid rgba(255,248,240,.45);display:flex;flex-direction:column;gap:16px;min-height:380px}
.card:last-child{border-right:0}
.card .big{font-family:var(--fd);font-size:76px;line-height:1}
.card .ic{height:76px;display:flex;align-items:flex-end}
.card .ic svg{width:58px;height:58px}
.card h3{font-family:var(--fh);text-transform:uppercase;letter-spacing:.2em;font-size:17px;font-weight:500}
.card p{font-size:21px}
.ladder{display:flex;flex-wrap:wrap;gap:4px 0;margin-top:auto;font-size:18px;font-style:italic}
.ladder span{white-space:nowrap}
.ladder span:not(:last-child)::after{content:"·";margin:0 7px;opacity:.6;font-style:normal}

/* ---------- visão e mestres ---------- */
.vis .head{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:end;margin-bottom:70px}
.vis h2{font-size:clamp(44px,5.4vw,86px);margin-top:20px}
.vis h2 .rot{color:var(--co);font-family:var(--fb);font-style:italic;font-weight:500;display:inline-block;min-width:4ch}
.vis h2 .rot.out{opacity:0;transform:translateY(-12px);transition:opacity .25s,transform .25s}
.vis h2 .rot.inn{animation:rin .45s cubic-bezier(.2,.7,.2,1)}
@keyframes rin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.vis p{font-size:22px;color:#DCD5C9}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.m{display:flex;flex-direction:column;gap:10px}
.m .fr{aspect-ratio:3/3.9;border:1px solid var(--ln);background:#24211E;border-radius:14px;position:relative;overflow:hidden;--ink:var(--cr);--danger:var(--co);transition:border-color .25s,transform .35s}
.m:hover .fr{border-color:var(--mut);transform:translateY(-4px)}
.m .fr svg{position:absolute;left:4%;top:2%;width:92%;height:auto}
.m .fr .dd{position:absolute;left:12px;bottom:10px;font-family:var(--fh);letter-spacing:.2em;font-size:11px;color:var(--mut)}
.m .t{font-style:italic;font-size:17px;line-height:1.25}
.mnote{margin-top:44px;display:flex;align-items:center;gap:18px;color:var(--mut);font-style:italic;font-size:19px}
.mnote canvas{width:130px;height:70px;color:var(--cr)}

/* ---------- percurso pela app ---------- */
.tour h2{font-size:clamp(46px,5.6vw,88px);margin:20px 0 26px}
.tour .sub{font-size:22px;max-width:34em}
.rail{display:flex;gap:34px;overflow-x:auto;scroll-snap-type:x mandatory;padding:70px max(24px,calc((100vw - 1180px)/2)) 30px;scrollbar-width:none;cursor:grab}
.rail::-webkit-scrollbar{display:none}
.rail figure{flex:0 0 auto;width:min(290px,70vw);scroll-snap-align:center}
.rail .phone{position:relative;left:auto;top:auto;transform:none;width:100%;box-shadow:0 0 0 1px #4a453f,0 30px 60px rgba(31,27,22,.28),0 8px 18px rgba(31,27,22,.18)}
.rail figcaption{margin-top:24px}
.rail figcaption b{display:block;font-family:var(--fh);text-transform:uppercase;letter-spacing:.2em;font-size:15px;font-weight:500;margin-bottom:6px}
.rail figcaption span{font-size:19px;line-height:1.35;display:block;color:#4A4741}
.railnav{display:flex;gap:10px;justify-content:flex-end}
.railnav button{width:52px;height:52px;border:1px solid #B9B0A2;display:flex;align-items:center;justify-content:center}
.railnav button:hover{background:var(--ink);color:var(--cr2)}
.railnav svg{width:20px;height:20px}
.tourfoot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:20px;flex-wrap:wrap}
.tourfoot p{font-size:19px;font-style:italic;color:#4A4741;max-width:40em}

/* ---------- criador ---------- */
.crt .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:90px;align-items:start}
.crt h2{font-size:clamp(44px,4.8vw,76px);margin-top:20px;position:sticky;top:120px}
.crt h2 em{color:var(--co)}
.letter p{font-size:23px;line-height:1.55;text-align:justify;hyphens:auto;-webkit-hyphens:auto;color:#E6E0D5}
.letter p+p{text-indent:1.6em}
.letter p:first-child::first-letter{font-family:var(--fd);float:left;font-size:4.1em;line-height:.84;padding:.06em .1em 0 0;color:var(--cr)}
.letter .end{text-indent:0!important;margin-top:34px;font-style:italic}
.sign{margin-top:8px}
.sign canvas{width:300px;height:162px;color:var(--cr)}
.sign .nm{font-family:var(--fd);font-size:26px;margin-top:-8px}
.sign .nm span{font-size:.7em}
.sign .cv{font-family:var(--fh);letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--mut);margin-top:8px;line-height:1.8}

/* ---------- preço ---------- */
.price .head{text-align:center;max-width:820px;margin:0 auto 70px}
.price h2{font-size:clamp(44px,5.4vw,84px);margin:20px 0 22px}
.price .head p{font-size:22px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
.plan{border:1px solid #CFC6B8;padding:40px 34px;display:flex;flex-direction:column;gap:6px;position:relative;background:#F7F2E9}
.plan h3{font-family:var(--fh);text-transform:uppercase;letter-spacing:.2em;font-size:16px;font-weight:500;color:#7A7266}
.plan .v{font-family:var(--fd);font-size:68px;line-height:1.05;margin-top:14px}
.plan .v .cm{font-family:var(--fb);font-weight:500}
.plan .v small{font-size:.62em;font-family:var(--fb);font-weight:500}
.plan p{font-size:19px;color:#4A4741}
.plan.hi{background:var(--dk);color:var(--cr);border-color:var(--dk)}
.plan.hi h3{color:var(--co)}
.plan.hi p{color:#CFC8BC}
.plan .tag{position:absolute;top:-1px;right:-1px;background:var(--co);color:#FFF8F0;font-family:var(--fh);letter-spacing:.18em;font-size:12px;padding:8px 12px;text-transform:uppercase}
.price .note{text-align:center;margin-top:34px;font-style:italic;font-size:19px;color:#4A4741}
.price .stores{justify-content:center}

/* ---------- perguntas ---------- */
.faq .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:90px}
.faq h2{font-size:clamp(44px,4.8vw,72px);margin-top:20px}
details{border-top:1px solid var(--ln)}
details:last-child{border-bottom:1px solid var(--ln)}
summary{list-style:none;cursor:pointer;padding:26px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;font-family:var(--fd);font-size:26px}
summary::-webkit-details-marker{display:none}
summary i{flex:0 0 auto;width:18px;height:18px;position:relative}
summary i::before,summary i::after{content:"";position:absolute;left:0;top:8px;width:18px;height:1.5px;background:var(--cr);transition:transform .25s}
summary i::after{transform:rotate(90deg)}
details[open] summary i::after{transform:rotate(0)}
details p{padding:0 0 28px;font-size:21px;color:#DCD5C9;max-width:34em}

/* ---------- fim ---------- */
.fin{text-align:center;padding:160px 0 140px;overflow:hidden}
.fin .stage{max-width:520px;margin:0 auto 10px}
.fin .stage img.lg{position:absolute;left:50%;top:50%;width:30%;transform:translate(-46%,-52%)}
.fin h2{font-size:clamp(48px,6.4vw,104px);margin:30px 0 16px}
.fin h2 em{color:var(--co)}
.fin p{font-size:23px;color:#DCD5C9}
.fin .stores{justify-content:center}
footer{border-top:1px solid var(--ln);padding:44px 0 60px;color:var(--mut);font-size:17px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
footer .by{display:flex;align-items:center;gap:16px}
footer .by img{height:40px}
footer a{text-decoration:none;border-bottom:1px solid var(--ln)}
footer a:hover{color:var(--cr)}
footer nav{display:flex;gap:22px;flex-wrap:wrap}

/* ---------- retratos (CSS da app) ---------- */
.va .ptw{fill:var(--ink);fill-rule:evenodd}
.va .ptr{fill:var(--danger);fill-rule:evenodd}
.va.va-port{transform:scale(1.12)}
.va .ptgl{fill:#fff;opacity:.68;animation:ptglm 4.6s ease-in-out infinite alternate}
.va [class*=" pt"],.va g[class^="pt"]{transform-box:view-box}
.va .ptjab{animation:ptjab 3.2s ease-in-out infinite}
.va .ptlip{animation:ptlip 4.2s ease-in-out infinite}
.va .ptsway{animation:ptsway 6s ease-in-out infinite}
.va .ptbob{animation:ptbob 2.4s ease-in-out infinite}
.va .ptbreathe{animation:ptbreathe 5s ease-in-out infinite}
.va .ptglow{animation:ptglow 4s ease-in-out infinite}
.va .ptwig{animation:ptwig 4.2s ease-in-out infinite}
.va .ptwig2{animation:ptwig2 4.4s ease-in-out infinite}
.va .ptskew{animation:ptskew 6s ease-in-out infinite}
.va .ptskew2{animation:ptskew 5.4s ease-in-out infinite}
.va .ptnod{animation:ptnod 6s ease-in-out infinite}
